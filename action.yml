name: CodeRev
description: Self-hosted PR review that runs a cheap model behind a refutation panel.
author: btsouth

inputs:
  pr:
    description: Pull request number to review. Defaults to the one that triggered the workflow.
    required: false
    default: ${{ github.event.pull_request.number }}
  api-key:
    description: Model API key. Pass a secret, never a literal.
    required: false
    default: ""
  provider:
    description: deepseek (default), openrouter, openai, meta, or exec.
    required: false
    default: deepseek
  model:
    description: Overrides the provider's default model.
    required: false
    default: ""
  base-url:
    description: Overrides the base URL for any OpenAI-compatible endpoint.
    required: false
    default: ""
  exec-command:
    description: Command for the exec provider. Use grok for CodeRev's bundled stdin-safe Grok wrapper.
    required: false
    default: ""
  conventions:
    description: Path to a conventions file to include in the prompt, for example AGENTS.md.
    required: false
    default: ""
  post:
    description: Post the review as a PR comment. Set false to print it to the log only.
    required: false
    default: "true"
  github-token:
    description: Token used for reading the diff and posting the comment. On Gitea and Forgejo this is the job token too.
    required: false
    default: ${{ github.token }}
  find2-provider:
    description: Second generator's provider (dual-generator mode). Empty disables it.
    required: false
    default: ""
  find2-model:
    description: Second generator's model. Empty uses the provider's default.
    required: false
    default: ""
  find2-api-key:
    description: Second generator's API key. Empty degrades to single-generator with a warning.
    required: false
    default: ""
  find2-exec-command:
    description: Command for an exec second generator. Empty inherits exec-command.
    required: false
    default: ""
  refute-provider:
    description: Route the refutation panel to a different provider (e.g. a non-reasoning model whose votes cost a fraction). Empty keeps the generator's provider.
    required: false
    default: ""
  refute-model:
    description: Panel model when refute-provider is set.
    required: false
    default: ""
  refute-api-key:
    description: Panel provider's API key. Empty disables the panel override.
    required: false
    default: ""
  refute-exec-command:
    description: Command for an exec refutation panel. Empty inherits exec-command.
    required: false
    default: ""
  gate:
    description: >-
      Fail the check (exit 3) when a surviving finding meets this severity
      (high, medium, or low). Fail-open on provider/infra errors. Empty keeps
      the check advisory. Pair with removing continue-on-error in the workflow.
    required: false
    default: ""
  linear-follow-ups:
    description: Create Linear issues for verified follow-up findings with high confidence.
    required: false
    default: "false"
  linear-api-key:
    description: Linear personal API key; required only when linear-follow-ups is true.
    required: false
    default: ""
  linear-team-id:
    description: Linear team ID for follow-up issues; required only when linear-follow-ups is true.
    required: false
    default: ""


runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REVIEW_API_KEY: ${{ inputs.api-key }}
        REVIEW_PROVIDER: ${{ inputs.provider }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_API_BASE_URL: ${{ inputs.base-url }}
        REVIEW_EXEC_COMMAND: ${{ inputs.exec-command }}
        REVIEW_FIND2_PROVIDER: ${{ (inputs.find2-api-key != '' || inputs.find2-exec-command != '') && inputs.find2-provider || '' }}
        REVIEW_FIND2_MODEL: ${{ (inputs.find2-api-key != '' || inputs.find2-exec-command != '') && inputs.find2-model || '' }}
        REVIEW_FIND2_API_KEY: ${{ inputs.find2-api-key }}
        REVIEW_FIND2_EXEC_COMMAND: ${{ inputs.find2-exec-command }}
        REVIEW_REFUTE_PROVIDER: ${{ (inputs.refute-api-key != '' || inputs.refute-exec-command != '') && inputs.refute-provider || '' }}
        REVIEW_REFUTE_MODEL: ${{ (inputs.refute-api-key != '' || inputs.refute-exec-command != '') && inputs.refute-model || '' }}
        REVIEW_REFUTE_API_KEY: ${{ inputs.refute-api-key }}
        REVIEW_REFUTE_EXEC_COMMAND: ${{ inputs.refute-exec-command }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        LINEAR_TEAM_ID: ${{ inputs.linear-team-id }}
        # Inputs reach the script through the environment, never by template
        # substitution into the script body, so no input value can become shell.
        INPUT_PR: ${{ inputs.pr }}
        INPUT_POST: ${{ inputs.post }}
        INPUT_GATE: ${{ inputs.gate }}
        INPUT_CONVENTIONS: ${{ inputs.conventions }}
        INPUT_LINEAR_FOLLOW_UPS: ${{ inputs.linear-follow-ups }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ ! "$INPUT_PR" =~ ^[0-9]+$ ]]; then
          echo "::error::CodeRev needs a pull request number; got '${INPUT_PR}'. Run it on pull_request events or pass pr." >&2
          exit 2
        fi
        args=(--pr "$INPUT_PR")
        if [[ "${REVIEW_PROVIDER,,}" == "exec" && "$REVIEW_EXEC_COMMAND" == "grok" ]]; then
          if [[ "${RUNNER_OS:-}" != "Windows" ]]; then
            echo "::error::The grok shorthand uses a Windows PowerShell wrapper and only runs on Windows runners. Pass a full exec-command instead." >&2
            exit 2
          fi
          export REVIEW_EXEC_COMMAND="C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"${ACTION_PATH}\\bin\\grok-stdin.ps1\""
        fi
        [[ "$INPUT_POST" == "true" ]] && args+=(--post)
        [[ -n "$INPUT_GATE" ]] && args+=(--gate "$INPUT_GATE")
        [[ -n "$INPUT_CONVENTIONS" ]] && args+=(--conventions "$INPUT_CONVENTIONS")
        [[ "$INPUT_LINEAR_FOLLOW_UPS" == "true" ]] && args+=(--linear-follow-ups)
        node "${ACTION_PATH}/bin/review-pr.ts" "${args[@]}"
